name: Update Notion Log

on:
  # 1. 깃허브 웹사이트에서 'Run workflow' 버튼을 눌러 수동 실행 가능하게 설정
  workflow_dispatch:
  # 2. 주기적으로 실행하고 싶다면 아래 주석(#)을 풀고 cron 표현식을 수정하세요 (예: 매일 자정)
  # schedule:
     - cron: '0 0 * * *'

permissions:
  contents: write  # 실행 후 README.md가 변경되면 저장소에 다시 쓸 수 있는 권한 부여

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      # 1. 저장소의 코드 파일들을 가상 컴퓨터로 가져오기
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 가상 컴퓨터에 파이썬 설치하기
      - name: Set up Python
        uses: actions/with-python@v5
        with:
          python-version: '3.10'

      # 3. 노션 API 호출에 필요한 패키지들 설치하기
      - name: Install Dependencies
        run: |
          pip install python-dotenv requests
          # 만약 notion-client 등 다른 라이브러리를 쓰신다면 여기에 추가하세요.

      # 4. 파이썬 스크립트 실행 (GitHub Secrets 환경변수 주입)
      - name: Run Python Script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python update_readme.py

      # 5. 실행 결과로 README.md가 변경되었다면 자동으로 커밋 및 푸시
      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add .
          git commit -m "docs: 노션 로그 기반 README 업데이트 [skip ci]" || echo "변경 사항 없음"
          git push

